    {label:"Packaging and Print", hand:["PKGL","PKG"], cat:"Packaging", box:[7,69.5,92,76], ring:null, mbox:[6,70,92,76.5], mring:null, ul:[11,58,75.9], mul:[9,58,76.4]},
    {label:"Resume (PDF)", hand:["RESUME"], href:CONFIG.links.resume, box:[12,80.5,47,86.5], ring:[32,84.6,11.5,2.7], mbox:[9,81,44,87.5], mring:[28.5,85.8,10.5,2.6]},
    {label:"Now available, get in touch", hand:["NOW","AVAIL"], href:CONFIG.links.available, box:[50,78,97,97], ring:[72.5,86.5,27,8,-17,"red"], mbox:[46,78,97,97], mring:[72,87,27.5,8.5,-17,"red"]}
  ];
  function svgArt(k){
    var L = LAYOUT[k], c = L.check, id = 'ben' + k, art = k === 'm' ? (CONFIG.menuImageMobile || CONFIG.menuImage) : CONFIG.menuImage;
    var hand = function(key){
      if (key === 'TICK') return '<path class="tick" d="'+L.tick+'" stroke-width="'+L.tickW+'"/>';
      var h = L.hand[key], t = CONFIG.hand[key]; if (!h || !t) return '';
      return '<text class="hw'+(key === 'NOW' || key === 'AVAIL' ? ' mk' : '')+'" transform="translate('+h[0]+' '+h[1]+') rotate('+h[3]+')" font-size="'+h[2]+'">'+esc(t)+'</text>';
    };
    var txt = function(a, w, fill, ls, lines){
      return '<text transform="translate('+a[0]+' '+a[1]+') rotate(-7.4)" fill="'+fill+'" font-size="'+a[2]+'" font-weight="'+w+'" letter-spacing="'+(ls||0)+'em" xml:space="preserve">' +
        lines.map(function(s,i){ return '<tspan x="0" y="'+(Array.isArray(a[3]) ? a[3][i] : a[3])+'">'+esc(s)+'</tspan>'; }).join('') + '</text>';
    };
    var spots = SPOTS.map(function(s){
      var bx = k === 'm' ? s.mbox : s.box, rg = k === 'm' ? s.mring : s.ring;
      var x = c[0] + c[2]*bx[0]/100, y = c[1] + c[3]*bx[1]/100, w = c[2]*(bx[2]-bx[0])/100, h = c[3]*(bx[3]-bx[1])/100;
      /* circles: blue ovals tilted 30 degrees; a 5th number sets its own tilt, a 6th makes it red */
      var ring = '';
      if (rg) { var rx = c[0]+c[2]*rg[0]/100, ry = c[1]+c[3]*rg[1]/100, red = rg[5] === 'red';
        ring = '<ellipse class="ring'+(red ? ' red' : '')+'" cx="'+rx+'" cy="'+ry+'" rx="'+(c[2]*rg[2]/100*(red ? 1 : 1.3))+'" ry="'+(c[3]*rg[3]/100*(red ? 1 : .72))+'" stroke-width="'+(c[2]*(red ? .009 : .0065))+'" transform="rotate('+(rg[4] == null ? -30 : rg[4])+' '+rx+' '+ry+')"/>'; }
      var u = k === 'm' ? s.mul : s.ul, sl = L.slope;
      var P = function(xp, yp){ return [c[0] + c[2]*xp/100, c[1] + c[3]*(yp + (40 - xp)*sl)/100]; };
      var extra = (s.hand || []).map(hand).join('');
      if (u) {
        var a0 = P(u[0],u[2]), a1 = P(u[1],u[2]), mx = (a0[0]+a1[0])/2, my = (a0[1]+a1[1])/2 + c[3]*.004;
        extra += '<path class="ul" pathLength="1" d="M'+a0.join(' ')+' Q'+mx+' '+my+' '+a1.join(' ')+'" stroke-width="'+(c[2]*.0065)+'"/>';
      }
      var attrs = s.cat ? 'href="#'+s.cat.toLowerCase()+'" role="button" aria-pressed="false" data-cat="'+s.cat+'"' : 'href="'+esc(s.href)+'"';
      return '<a '+attrs+' aria-label="'+esc(s.label)+'"><rect class="hit" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4"/>'+extra+ring+'</a>';
    }).join('');
    return '<svg class="ben-art ben-art-'+k+'" viewBox="0 0 '+L.w+' '+L.h+'" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Menu">' +
      '<image class="ben-menu-img" href="'+esc(art)+'" x="'+L.art[0]+'" y="'+L.art[1]+'" width="'+L.art[2]+'" height="'+L.art[3]+'" preserveAspectRatio="none"/>' +
      '<g aria-label="'+esc(CONFIG.name+', '+CONFIG.who)+'">' +
      txt(L.name, 700, '#991B30', 0, [CONFIG.name]) +
      '<line x1="'+L.rule[0]+'" y1="'+L.rule[1]+'" x2="'+L.rule[2]+'" y2="'+L.rule[3]+'" stroke="#991B30" stroke-width="'+L.rule[4]+'"/>' +
      txt(L.who, 400, '#991B30', L.who[4], [CONFIG.who]) +
      txt([L.tag[0],L.tag[1],L.tag[2],L.tag[3]], 400, '#525252', L.tag[4], k === 'd' ? CONFIG.taglineDesktop : CONFIG.taglinePhone) +
      '</g>' + spots + '</svg>';
  }
  /* napkin font (TT Interphases) */
  if (CONFIG.napkinFontUrl && CONFIG.napkinFontUrl.indexOf('PASTE') !== 0) {
    var ff = document.createElement('style');
    ff.textContent = '@font-face{font-family:"TT Interphases Pro";src:url("' + CONFIG.napkinFontUrl + '");font-weight:100 900;font-display:swap}';
    document.head.appendChild(ff);
  }
  $('ben-left').innerHTML = svgArt('d') + svgArt('m');
  /* the desk */
  var desk = $('ben-desk');
  /* shuffle: every visit each print lands in a new random spot and the stacking order is mixed, so every project gets a turn on top.
     With shuffle off, prints use their x/y/r from the list (or a fixed spot) and later projects sit on top. */
  var order = CONFIG.projects.map(function(p,i){ return i; });
  if (CONFIG.shuffle) for (var o = order.length - 1; o > 0; o--) { var q = Math.floor(Math.random() * (o + 1)), t = order[o]; order[o] = order[q]; order[q] = t; }
  var layer = []; order.forEach(function(pi, n){ layer[pi] = n + 1; });
  /* spread: each print tries 60 random spots and keeps the one that overlaps the prints already placed the least (biggest prints go first) */
  var DW = desk.clientWidth || 1000, DH = desk.clientHeight || 700, placed = [], picked = [];
  function overlap(a, b){ var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y); return ox > 0 && oy > 0 ? ox * oy : 0; }
  if (CONFIG.shuffle) CONFIG.projects.map(function(p,i){ return i; }).sort(function(a,b){ return (CONFIG.projects[b].w || 24) - (CONFIG.projects[a].w || 24); }).forEach(function(i){
    var w = CONFIG.projects[i].w || 24, best = null, bestScore = Infinity;
    for (var t = 0; t < 60; t++) {
      var c = {x: Math.random() * (100 - w), y: Math.random() * 64}, box = {x: c.x / 100 * DW, y: c.y / 100 * DH, w: w / 100 * DW, h: w / 100 * DW * 0.85}, score = 0;
      placed.forEach(function(o){ score += overlap(box, o); });
      if (score < bestScore) { bestScore = score; best = c; best.box = box; }
    }
    placed.push(best.box); picked[i] = {x: Math.round(best.x), y: Math.round(best.y), r: Math.round(Math.random() * 12 - 6)};
  });
  var spots = CONFIG.projects.map(function(p,i){
    if (CONFIG.shuffle) return picked[i];
    var s = 0, k = p.title || ('' + i); for (var j = 0; j < k.length; j++) s = (s * 31 + k.charCodeAt(j)) % 9973;
    return {x: p.x != null ? p.x : 4 + s % 62, y: p.y != null ? p.y : 4 + (s * 7) % 60, r: p.r != null ? p.r : (s % 13) - 6};
  });
  function spot(p,i){ return spots[i]; }
  /* top print first in the page, so phones (one list, no pile) also start with a different project each visit */
  desk.innerHTML = order.slice().reverse().map(function(i){ var p = CONFIG.projects[i];
    var media = /\.(mp4|webm)(\?|$)/i.test(p.img)
      ? '<video src="'+esc(p.img)+'" autoplay muted loop playsinline></video>'
      : '<img src="'+esc(p.img)+'" alt="'+esc(p.title)+'" draggable="false">';
    return '<a class="ben-print" href="'+esc(p.url)+'" data-i="'+i+'" style="left:'+spot(p,i).x+'%;top:'+spot(p,i).y+'%;width:'+(p.w || 24)+'%;transform:rotate('+spot(p,i).r+'deg);z-index:'+layer[i]+'">'+media+'<i class="ben-sticker" aria-hidden="true"></i><span>'+esc(p.client)+' · '+esc(p.title)+'</span></a>';
  }).join('');
  var prints = root.querySelectorAll('.ben-print');
  /* the lines on the check filter the desk; tap the circled one again to show everything */
  var catBtns = root.querySelectorAll('.ben-art a[data-cat]');
  /* sample stickers, used until CONFIG.stickers has your own */
  var MINE = (CONFIG.stickers || []).filter(function(u){ return u && u.indexOf('PASTE') !== 0; });
  var STICKERS = MINE.length ? MINE : [
    ['#D3201F','#FFF6D8',"CHEF'S","PICK"], ['#0001AD','#FFF6D8','FRESH','DAILY'], ['#F2C230','#1A1A1B','HOT','STUFF!'],
    ['#2F6B3A','#FFF6D8','HOUSE','FAVE'], ['#FFF6D8','#D3201F','ORDER','UP!'], ['#1A1A1B','#F2C230','NEW','ON MENU']
  ].map(function(c){
    return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="'+c[0]+'" stroke="#fff" stroke-width="5"/><circle cx="50" cy="50" r="38" fill="none" stroke="'+c[1]+'" stroke-width="1.5" stroke-dasharray="3 3"/><text x="50" y="47" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="15" fill="'+c[1]+'">'+c[2]+'</text><text x="50" y="65" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="'+(c[3].length > 6 ? 11 : 15)+'" fill="'+c[1]+'">'+c[3]+'</text></svg>');
  });
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var current = null, shown = null;
  /* light up one category: its prints straighten, go to color and each gets a different sticker on a random corner */
  function preview(cat){
    var show = cat || current;
    if (show === shown) return;
    shown = show;
    var pool = shuffle(STICKERS), n = 0, corners = ['tl','tr','bl','br'];
    CONFIG.projects.forEach(function(p,i){
      var pr = desk.querySelector('.ben-print[data-i="'+i+'"]'); if (!pr) return;
      var on = !!show && p.cat === show, st = pr.querySelector('.ben-sticker');
      if (on && st) {
        st.className = 'ben-sticker ' + corners[Math.floor(Math.random() * 4)];
        st.style.backgroundImage = 'url("' + pool[n++ % pool.length] + '")';
        st.style.setProperty('--sr', (Math.random() * 40 - 20).toFixed(1) + 'deg');
      }
      pr.classList.toggle('lit', on);
    });
  }
  /* hovering one print: it gets one random sticker on a top corner, and its line on the check lights up */
  prints.forEach(function(pr){
    var p = CONFIG.projects[+pr.dataset.i];
    pr.addEventListener('pointerenter', function(e){
      if (e.pointerType !== 'mouse') return;
      catBtns.forEach(function(b){ b.classList.toggle('hov', b.dataset.cat === p.cat); });
      if (pr.classList.contains('lit')) return; /* already has a sticker from the check */
      var inUse = [].map.call(desk.querySelectorAll('.ben-print.lit .ben-sticker'), function(x){ return x.style.backgroundImage; });
      var pool = STICKERS.filter(function(u){ return inUse.indexOf('url("' + u + '")') < 0; });
      if (!pool.length) pool = STICKERS;
      var st = pr.querySelector('.ben-sticker'); if (!st) return;
      st.className = 'ben-sticker ' + (Math.random() < .5 ? 'tl' : 'tr');
      st.style.backgroundImage = 'url("' + pool[Math.floor(Math.random() * pool.length)] + '")';
      st.style.setProperty('--sr', (Math.random() * 40 - 20).toFixed(1) + 'deg');
      pr.classList.add('stk');
    });
    pr.addEventListener('pointerleave', function(){
      pr.classList.remove('stk');
      catBtns.forEach(function(b){ b.classList.remove('hov'); });
    });
  });
  function pick(cat){
    catBtns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.cat === cat); });
    shown = undefined; preview(null);
  }
  catBtns.forEach(function(b){
    b.addEventListener('click', function(e){
      e.preventDefault();
      current = current === b.dataset.cat ? null : b.dataset.cat;
      pick(current);
      if (current && window.matchMedia('(max-width:860px)').matches) $('ben-right').scrollIntoView({behavior:'smooth'});
    });
    b.addEventListener('keydown', function(e){ if (e.key === ' ') { e.preventDefault(); b.click(); } });
    /* hovering a line previews its projects; moving off goes back to whatever is picked */
    b.addEventListener('pointerenter', function(e){ if (e.pointerType === 'mouse') preview(b.dataset.cat); });
    b.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') { if (current !== b.dataset.cat) preview(null); } });
    b.addEventListener('focus', function(){ preview(b.dataset.cat); });
    b.addEventListener('blur', function(){ preview(null); });
  });
  /* open with a line already picked, e.g. /home-new#brand (used by the check on other pages) */
  var want = decodeURIComponent((location.hash || '').slice(1)).toLowerCase();
  if (want) catBtns.forEach(function(b){ if (b.dataset.cat.toLowerCase() === want && current === null) b.click(); });
  /* drag the prints around the desk (desktop mouse only); a click without dragging opens the project */
  var zTop = CONFIG.projects.length + 1;
  /* how far a print may go [minLeft, maxLeft, minTop, maxTop] in px, so the whole print stays visible */
  function bounds(el){
    var w = el.offsetWidth, h = el.offsetHeight, a = Math.abs((parseFloat((el.style.transform.match(/-?[\d.]+/) || [0])[0]) || 0) * Math.PI / 180);
    var ex = (w * Math.cos(a) + h * Math.sin(a) - w) / 2 + 6, ey = (w * Math.sin(a) + h * Math.cos(a) - h) / 2 + 6; /* room for the tilt and shadow */
    var minL = root.classList.contains('ben-table') ? ex - desk.offsetLeft : ex;
    return [minL, desk.clientWidth - w - ex, ey, desk.clientHeight - h - ey];
  }
  /* keep the whole pile on one screen: shrink the prints a bit on short screens, then nudge any print that pokes out back in */
  function fit(){
    if (window.matchMedia('(max-width:860px)').matches) return;
    var W = desk.clientWidth, H = desk.clientHeight; if (!W || !H) return;
    var k = Math.min(1, H / (W * 0.92));
    prints.forEach(function(el){
      var p = CONFIG.projects[+el.dataset.i]; el.style.width = ((p.w || 24) * k) + '%';
      var b = bounds(el), l = el.offsetLeft, t = el.offsetTop;
      if (l < b[0] || l > b[1]) el.style.left = (Math.min(b[1], Math.max(b[0], l)) / W * 100) + '%';
      if (t < b[2] || t > b[3]) el.style.top = (Math.max(b[2], Math.min(b[3], t)) / H * 100) + '%';
    });
  }
  /* every photo is cropped to the closest of 1:1, 3:2 or 2:3 */
  function snap(m){
    var w = m.naturalWidth || m.videoWidth, h = m.naturalHeight || m.videoHeight; if (!w || !h) return;
    var r = Math.log(w / h), best = [1, 1];
    [[3,2],[1,1],[2,3]].forEach(function(o){ if (Math.abs(r - Math.log(o[0] / o[1])) < Math.abs(r - Math.log(best[0] / best[1]))) best = o; });
    m.style.aspectRatio = best[0] + ' / ' + best[1];
  }
  desk.querySelectorAll('img').forEach(function(m){ if (m.complete) snap(m); else m.addEventListener('load', function(){ snap(m); fit(); }); });
  desk.querySelectorAll('video').forEach(function(m){ m.addEventListener('loadedmetadata', function(){ snap(m); fit(); }); });
  fit();
  var fitT; window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(fit, 120); });
  prints.forEach(function(el){
    var sx, sy, ox, oy, moved = false, down = false;
    el.addEventListener('pointerdown', function(e){
      if (e.pointerType !== 'mouse' || window.matchMedia('(max-width:860px)').matches) return;
      down = true; moved = false; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop;
      el.setPointerCapture(e.pointerId); el.style.zIndex = ++zTop;
    });
    el.addEventListener('pointermove', function(e){
      if (!down) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
      moved = true; el.classList.add('dragging');
      var b = bounds(el);
      el.style.left = (Math.min(b[1], Math.max(b[0], ox + dx)) / desk.clientWidth * 100) + '%';
      el.style.top = (Math.min(b[3], Math.max(b[2], oy + dy)) / desk.clientHeight * 100) + '%';
    });
    el.addEventListener('pointerup', function(){ down = false; el.classList.remove('dragging'); });
    el.addEventListener('click', function(e){ if (moved){ e.preventDefault(); moved = false; } });
  });
})();
</script>
